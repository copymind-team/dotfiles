set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# Prefix key
set -g prefix C-b
bind C-b send-prefix

set -g escape-time 10
set -g history-limit 50000

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Make new windows start after current
bind c new-window -a -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style splits
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
# Session picker: jump keys 1-9 then a-z (tmux's own choose-session starts at 0
# and switches to M-a from the tenth entry, and is not configurable)
bind S run-shell -b "PICKER_CLIENT='#{client_name}' $HOME/.tmux/session-select.sh"

# Session monitor: what every session's Claude window is doing, with jump keys
bind M run-shell -b "$HOME/.tmux/monitor.sh"

# Copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Start from window index 1
set -g base-index 1
setw -g pane-base-index 1
# Automatically renumber-windows
set -g renumber-windows on
# visuals
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=default'
set -g window-status-style "bg=default"
set -g status-bg default
set -g window-status-current-style "bg=default"
set -g status-left '#[fg=#1F1F28,bg=#957FB8,bold] #S #[default]'
set -g status-left-length 20
set -g status-right ''

set -g pane-border-lines single
set -g pane-border-style 'fg=#54546D'
set -g pane-active-border-style 'fg=#957FB8'
setw -g window-status-separator ''
setw -g window-status-current-format '  #I #W #F  '
setw -g window-status-format '  #I #W #F  '
setw -g window-status-current-style 'bg=#C8C093 fg=#1F1F28  bold'
setw -g window-status-style 'bg=default fg=#C8C093'

# F12 nested session toggle
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=#C8C093,bg=#2D4F67" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

# Show [OFF] indicator when keys are off
set -g status-right '#([ $(tmux show-option -qv key-table) = "off" ] && echo " [OFF] ")'

# Allow passthrough
set -g allow-passthrough on
set -s set-clipboard on

setw -g mode-keys vi

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
# Every five minutes rather than fifteen. What a pane comes back as is whatever
# the last snapshot says, so the interval is also how far out of date the answer
# is allowed to be -- and a save is a few forks and four kilobytes.
set -g @continuum-save-interval '5'

# Bring back the Claude Code session each pane was running, not just its shell.
#
# resurrect restores a pane's directory on its own, but it only re-runs a process
# if that process is on this list -- claude is not on the default one, so the
# window comes back as a bare shell in the right place. The "->" half says what to
# run instead of the saved command line: a wrapper, because which conversation
# belonged to which pane is not something resurrect records. claude-save.sh writes
# that down at save time; claude-restore.sh reads it and resumes.
#
# Matched with a leading ~ so it catches "claude -r" and "claude --resume <id>"
# too, all of which restore through the same wrapper.
#
# These must be set before tpm loads: @continuum-restore fires during that run,
# and would otherwise restore against the default process list.
set -g @resurrect-processes '"~claude->~/.tmux/claude-restore.sh"'
set -g @resurrect-hook-post-save-all '~/.tmux/claude-save.sh'

# claude-snapshot.sh saves on its own from Claude's SessionStart and SessionEnd
# hooks, to catch what the interval above misses in either direction: a session
# started since the last save, and one quit with /exit that a stale save would
# reopen. It needs to know when a restore is running, because a restore brings
# panes up one at a time and a save taken mid-flight records half a layout.
set -g @resurrect-hook-pre-restore-all  '~/.tmux/claude-snapshot.sh restore-begin'
set -g @resurrect-hook-post-restore-all '~/.tmux/claude-snapshot.sh restore-end'

# Point resurrect's "last" symlink back at a save that exists, before continuum
# gets a chance to restore from it. A dangling "last" is the one failure restore.sh
# cannot see past -- it tests -f on that link before reading anything, so a broken
# one reads as "no save file" no matter how many saves sit beside it. Above tpm
# because @continuum-restore fires during that run. resurrect-guard.sh explains
# how the link comes to outlive its target.
run-shell '$HOME/.tmux/resurrect-guard.sh repair'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# Every save through the guard, so no two can collide on a filename. Set after tpm
# rather than with the other plugin options: resurrect.tmux writes this option
# itself on load, unconditionally, and would overwrite an earlier value. Continuum
# reads it at each save rather than at load, so the last writer is the one that
# counts. The C-s binding is resurrect's own and is rebound here for the same
# reason.
run-shell 'tmux set -g @resurrect-save-script-path "$HOME/.tmux/resurrect-guard.sh"'
bind C-s run-shell '$HOME/.tmux/resurrect-guard.sh'
